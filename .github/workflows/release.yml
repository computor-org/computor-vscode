name: Release VSIX

# Publishing is driven by a GitHub release. The channel is an explicit input
# rather than something derived from the version number: the Marketplace marks
# a pre-release solely through vsce's --pre-release flag, and semester CalVer
# (2026.10.x, 2027.3.x) gives the minor no spare parity to encode it in.
#
# The validation step is the guard that the tag, the GitHub pre-release
# checkbox, and the flag actually passed to vsce all agree.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options: [pre-release, stable]
      publish:
        description: Publish to the VS Code Marketplace
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  vsix:
    permissions:
      contents: write # gh release upload
      id-token: write # azure/login OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Resolve channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              channel=pre-release
            else
              channel=stable
            fi
          else
            channel="${{ inputs.channel }}"
          fi
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
          echo "resolved channel: $channel"

      - name: Validate tag, channel, and pre-release flag agree
        if: github.event_name == 'release'
        run: |
          node scripts/release-channel.mjs check-github \
            "$GITHUB_REF_NAME" \
            "${{ github.event.release.prerelease }}" \
            "${{ steps.channel.outputs.channel }}"

      - run: npm ci --no-audit --no-fund --ignore-scripts

      - run: npm run type-check
      - run: npm run lint
      - run: npm run check:assets
      - run: npm run test:coverage

      - name: Package VSIX
        env:
          COMPUTOR_RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: npm run package:vsix

      - name: Checksum
        run: sha256sum ./*.vsix > SHA256SUMS

      # The VSIX is attached to the GitHub release regardless of whether it is
      # published, so the artifact is downloadable independently of the
      # Marketplace.
      - name: Attach to the GitHub release
        if: github.event_name == 'release'
        run: gh release upload "$GITHUB_REF_NAME" ./*.vsix SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: computor-vsix-${{ steps.channel.outputs.channel }}
          path: |
            ./*.vsix
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      # Marketplace publication is opt-in. A normal GitHub release remains a
      # green, reproducible artifact build; the human publisher may run the
      # documented Azure-backed command after checking the attached VSIX.
      - name: Azure login
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to the Marketplace
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          COMPUTOR_RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish:marketplace
