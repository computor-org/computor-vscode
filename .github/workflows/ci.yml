name: ci

on:
  push:
    branches: [main, 'release/**', 'refactor/**', 'tests/**', 'feat/**', 'fix/**', 'chore/**', 'ci/**']
  pull_request:
    branches: [main, 'release/**']
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-extension-host:
    # Required jobs run in the merge queue, not on pull request events.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        vscode: ['1.74.3', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: xvfb-run -a npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
  check:
    # Required jobs run in the merge queue, not on pull request events.
    if: github.event_name != 'pull_request'
    name: type-check + lint + unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check webview asset paths
        run: npm run check:assets

      - name: Backend compatibility (live semester lines, compat/lines.json)
        run: npm run check:backend-compat

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Webpack build
        run: npm run compile:fast

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # The single required check. On pull requests the jobs above are skipped and
  # this passes; in the merge queue it fails unless every job succeeded.
  ci-gate:
    if: always()
    needs: [public-extension-host, check]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
