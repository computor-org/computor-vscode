name: ci

on:
  push:
    branches: [main, 'release/**', 'refactor/**', 'tests/**', 'feat/**', 'fix/**', 'chore/**', 'ci/**']
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-extension-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        vscode: ['1.74.3', stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: xvfb-run -a npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
  check:
    name: type-check + lint + unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check webview asset paths
        run: npm run check:assets

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Webpack build
        run: npm run compile:fast

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
