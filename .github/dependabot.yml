# Dependabot version updates with a supply-chain cooldown.
#
# `cooldown` delays *version* updates until a release has aged; it does not
# apply to *security* updates, which open as soon as an advisory is published
# (GitHub docs: dependabot-options-reference#cooldown).
#
# Day-to-day work targets the release branch; update every `target-branch`
# when it rolls over. Security PRs always target the default branch.

version: 2
updates:
  # CI installs with `npm ci` from package-lock.json, the only lockfile.
  - package-ecosystem: npm
    directories:
      - /
      - /webview-dev
    target-branch: release/2026.10
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      npm-dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      npm-runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # The API types must not exceed the oldest VS Code the extension supports (engines.vscode ^1.74.0).
      - dependency-name: "@types/vscode"
        versions: [">=1.75.0"]
      # chai 5+ is ESM-only; under the CommonJS ts-node mocha setup it fails to load on Node 22 (require(esm) race).
      - dependency-name: chai
        update-types: ["version-update:semver-major"]
      # Node type definitions follow the oldest supported runtime (VS Code 1.74 runs Node 16); newer ones fail to parse under TypeScript 4.9.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 removes moduleResolution=node10 (our tsconfig) and the JavaScript compiler API that ts-loader uses.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # js-yaml 5 changes load()/dump() (YAML 1.2 core schema, removed dump options) used by the example commands; move it with a code change.
      - dependency-name: js-yaml
        update-types: ["version-update:semver-major"]
      # vsce 4 requires Node >= 22, while CI and the release workflow package on Node 20.
      - dependency-name: "@vscode/vsce"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: release/2026.10
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
