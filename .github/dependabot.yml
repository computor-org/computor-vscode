# Dependabot version updates with a supply-chain cooldown.
#
# `cooldown` delays *version* updates until a release has aged; it does not
# apply to *security* updates, which open as soon as an advisory is published
# (GitHub docs: dependabot-options-reference#cooldown).
#
# Day-to-day work targets the release branch; update every `target-branch`
# when it rolls over. Security PRs always target the default branch.

version: 2
updates:
  # CI installs with `npm ci` from package-lock.json. The root also carries a
  # stray yarn.lock that no workflow uses (vsce runs with --no-yarn).
  - package-ecosystem: npm
    directories:
      - /
      - /webview-dev
    target-branch: release/2026.10
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      npm-dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      npm-runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: release/2026.10
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
